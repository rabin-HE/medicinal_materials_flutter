server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 启用 gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 安全头（每个 location 里只要自己写了 add_header，就必须把这些再写一遍，
    # 否则 nginx 不再继承 server 级的 add_header）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 处理 Flutter Web 的 SPA 路由 - 所有路径都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口 HTML 绝不缓存：否则浏览器会拿旧的 index.html 配新部署的 main.dart.js，
    # 表现就是「刷新没用、一直白屏」，硬刷也不一定能救回来。
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Flutter 的入口脚本文件名不带内容指纹，改一次代码文件名不变——
    # 钉死 1 年会让用户永远用旧版本，所以只允许协商缓存。
    location ~* ^/(flutter_bootstrap\.js|flutter_service_worker\.js|main\.dart\.js|main\.js|manifest\.json|version\.json)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # 字典、字体清单等会在重新部署时被覆盖，同样不能长缓存
    location ^~ /assets/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # CanvasKit 与图标字体按 Flutter 引擎版本固定（目录里就带版本号），可以长缓存
    location ^~ /canvaskit/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    location ~* ^/(icons/|favicon\.png$) {
        expires 7d;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}