version: '3.8'

services:
  medicinal-materials-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medicinal-materials-app
    ports:
      - "18082:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
