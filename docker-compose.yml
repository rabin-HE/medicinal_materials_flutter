services:
  medicinal-materials-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medicinal-materials-app
    ports:
      - "18082:80"
    restart: unless-stopped
    healthcheck:
      # 用 127.0.0.1 而不是 localhost：容器里 wget 会把 localhost 解析成 ::1，
      # 而 nginx 只监听 IPv4，健康检查会一直 "Connection refused" 判成 unhealthy
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
